server:
  port: 8080

spring:
  application:
    name: ativos-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Served-By, ativos-gateway
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders: X-Served-By
                maxAge: 3600
          routes:
            # O frontend só fala com o BFF: todas as chamadas /api/** e o /aggregated-data seguem para ele.
            - id: bff
              uri: ${BFF_URL:http://localhost:8084}
              predicates:
                - Path=/api/**,/aggregated-data

# Chave exigida no cabeçalho X-API-Key (vazia = sem bloqueio, só para desenvolvimento local).
gateway:
  api-key: ${GATEWAY_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        # Sem o endpoint "gateway": ele lista as rotas internas e permite alterá-las, sem passar pela chave.
        include: health,info
