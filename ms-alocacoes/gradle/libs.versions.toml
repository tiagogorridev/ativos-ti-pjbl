[versions]
kotlin = "2.4.20"
spring-boot = "4.1.1"
dependency-management = "1.1.7"
springdoc = "3.1.0"
mockk = "1.14.5"
archunit = "1.5.1"

[libraries]
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
