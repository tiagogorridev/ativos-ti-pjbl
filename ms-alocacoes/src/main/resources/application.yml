server:
  port: ${PORT:8083}

spring:
  application:
    name: ms-alocacoes
  datasource:
    # Em nuvem: string JDBC do Azure SQL (variável de ambiente, nunca no código).
    # Local: SQL Server do docker-compose.yml desta pasta.
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=alocacoes;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:Local#Dev2026}
    hikari:
      # Nenhuma conexão fica aberta quando o serviço está ocioso: assim o banco gratuito
      # do Azure SQL consegue pausar sozinho e não consome a cota mensal à toa.
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      # O Azure SQL gratuito pode estar pausado; a primeira conexão espera ele acordar.
      connection-timeout: 90000
  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 10
    connect-retries-interval: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # O health check não consulta o banco, para não acordar o Azure SQL a cada verificação.
    db:
      enabled: false
